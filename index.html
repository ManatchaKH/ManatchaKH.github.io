<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060a12">
<meta name="description" content="Manatcha Khemglad Digital Business Card">
<title>Manatcha Khemglad | Digital Card</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:#fff;
 background:
 radial-gradient(circle at 10% 0%,rgba(45,75,145,.78),transparent 36%),
 radial-gradient(circle at 100% 100%,rgba(8,95,115,.65),transparent 40%),#060a12;
 display:flex;justify-content:center;padding:22px 14px;
}
.card{
 position:relative;width:min(430px,100%);padding:25px 18px 24px;
 border:1px solid rgba(255,255,255,.14);border-radius:30px;
 background:rgba(255,255,255,.055);backdrop-filter:blur(20px);
 -webkit-backdrop-filter:blur(20px);box-shadow:0 25px 70px rgba(0,0,0,.52);overflow:hidden;
}
.card:before{
 content:"";position:absolute;width:260px;height:260px;left:-100px;top:-140px;
 background:rgba(80,130,255,.13);filter:blur(65px);pointer-events:none;z-index:0;
}
.watermark-layer{
 position:absolute;z-index:1;width:145%;height:120%;left:-22%;top:-10%;
 transform:rotate(-17deg);pointer-events:none;user-select:none;opacity:.115;
 display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:120px;gap:24px 10px;
}
.watermark-item{width:105px;height:auto;object-fit:contain;opacity:.75;filter:brightness(1.05) contrast(.95)}
.company-logo{
 position:relative;z-index:3;width:170px;max-width:82%;max-height:75px;object-fit:contain;
 display:block;margin:0 auto 17px;filter:drop-shadow(0 5px 14px rgba(0,0,0,.40));
}
.photo{
 position:relative;z-index:3;width:118px;height:118px;border-radius:50%;object-fit:cover;
 object-position:center top;display:block;margin:auto;border:3px solid #fff;
 box-shadow:0 0 0 5px rgba(255,255,255,.045),0 0 38px rgba(92,124,255,.48);
}
h1{position:relative;z-index:3;text-align:center;margin:16px 0 4px;font-size:28px;line-height:1.2;letter-spacing:.2px}
.role{position:relative;z-index:3;text-align:center;color:#bac6dd;margin:0 0 20px;font-size:16px;line-height:1.5}
.badge{
 position:relative;z-index:3;display:block;width:max-content;max-width:100%;margin:0 auto 22px;
 padding:8px 15px;border-radius:999px;background:rgba(255,255,255,.075);
 border:1px solid rgba(255,255,255,.13);color:#c7d3ec;font-size:12px;
 box-shadow:0 5px 20px rgba(0,0,0,.18);
}
.buttons{position:relative;z-index:3;display:grid;gap:11px}
.btn{
 width:100%;min-height:54px;display:flex;align-items:center;justify-content:center;gap:10px;
 padding:15px 16px;border-radius:16px;color:#fff;text-decoration:none;font-size:16px;
 font-weight:700;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.065);
 border:1px solid rgba(255,255,255,.13);transition:transform .15s ease,filter .15s ease,box-shadow .15s ease;
}
.call-btn{background:linear-gradient(135deg,#6558ff,#009edb);border:none;box-shadow:0 8px 25px rgba(0,158,219,.27)}
.line-btn{background:#06c755;border-color:#06c755;box-shadow:0 8px 22px rgba(6,199,85,.27)}
.email-btn{background:#f3212b;border-color:#f3212b;box-shadow:0 8px 22px rgba(243,33,43,.27)}
.save-btn{background:rgba(255,255,255,.075)}
.btn:hover{filter:brightness(1.08);box-shadow:0 10px 28px rgba(0,0,0,.22)}
.btn:active{transform:scale(.97)}

.sharebox{
 position:relative;z-index:3;margin-top:16px;padding:12px;
 border:1px solid rgba(255,255,255,.11);border-radius:19px;background:rgba(0,0,0,.13);
}
.sharetitle{text-align:center;color:#aebbd0;font-size:11px;letter-spacing:1.4px;margin:0 0 10px}
.sharegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sharebtn{
 min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;
 border-radius:15px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);
 color:#fff;font-family:inherit;font-size:13px;font-weight:750;cursor:pointer;
 transition:transform .15s ease,filter .15s ease;
}
.sharebtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sharebtn:hover{filter:brightness(1.10)}
.sharebtn:active{transform:scale(.97)}
.qr{
 display:none;margin:13px auto 4px;width:164px;height:164px;background:#fff;border-radius:17px;
 padding:11px;align-items:center;justify-content:center;
}
.qr.show{display:flex}
#qr{width:142px;height:142px;display:flex;align-items:center;justify-content:center}
#qr svg{width:142px;height:142px;display:block}
.hint{text-align:center;color:#7f8ba0;font-size:10px;margin-top:7px}
footer{position:relative;z-index:3;text-align:center;color:#69748c;font-size:11px;margin-top:20px;letter-spacing:.2px}
@media(max-width:380px){
 body{padding:12px 10px}
 .card{padding:22px 14px 20px;border-radius:25px}
 .company-logo{width:150px}.photo{width:105px;height:105px}
 h1{font-size:24px}.role{font-size:14px}.btn{min-height:51px;font-size:15px}
 .watermark-layer{grid-auto-rows:100px}.watermark-item{width:85px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}.btn,.sharebtn{transition:none}
}
</style>
</head>

<body>

<div class="watermark-layer">

<img class="watermark-item" src="company-logo.png" alt="">
<img class="watermark-item" src="company-logo.png" alt="">
<img class="watermark-item" src="company-logo.png" alt="">
<img class="watermark-item" src="company-logo.png" alt="">
<img class="watermark-item" src="company-logo.png" alt="">

<img class="watermark-item" src="company-logo.png" alt="">
<img class="watermark-item" src="company-logo.png" alt="">
<img class="watermark-item" src="company-logo.png" alt="">
<img class="watermark-item" src="company-logo.png" alt="">
</div>

<img class="company-logo" src="company-logo.png" alt="Han's Laser">
<img class="photo" src="profile.jpg" alt="Manatcha Khemglad">

<h1>Manatcha Khemglad</h1>

<div class="buttons">
<a class="btn call-btn" href="tel:+66991363677">📞 Call me</a>
<a class="btn line-btn" href="https://line.me/ti/p/DYkaL3vXRd" target="_blank" rel="noopener">💬 LINE</a>

<circle cx="23" cy="6" r="3"></circle>
<circle cx="8" cy="16" r="3"></circle>

<path d="M5 11V6h5M21 6h5v5M27 21v5h-5M11 26H6v-5"></path>
<path d="M10 10h4v4h-4zM18 10h4v4h-4zM10 18h4v4h-4zM18 18h4v4h-4z"></path>
</svg>

</div>

</div>

</div>

<footer>Powered by GitHub Pages • NFC Ready</footer>

</main>

<script>
const cardUrl=window.location.href;

function generateQR(){
 const qrElement=document.getElementById("qr");
 if(typeof qrcode==="undefined"){setTimeout(generateQR,300);return}
 try{
  const qr=qrcode(0,"M");
  qr.addData(cardUrl);
  qr.make();
  qrElement.innerHTML=qr.createSvgTag(5,0);
  const svg=qrElement.querySelector("svg");
  if(svg){
   svg.setAttribute("width","142");
   svg.setAttribute("height","142");
   svg.style.width="142px";
   svg.style.height="142px";
   svg.style.display="block";
  }
 }catch(error){console.error(error)}
}

function toggleQR(){
 const qrBox=document.getElementById("qrBox");
 const scanText=document.getElementById("scanText");
 const hint=document.getElementById("qrHint");
 const showing=qrBox.classList.toggle("show");
 scanText.textContent=showing?"Hide QR":"Scan Card";
 hint.textContent=showing?"Scan this QR to open my card":"Tap Scan Card to show QR";
}

function saveContact(){
 const vcard=`BEGIN:VCARD
VERSION:3.0
FN:Manatcha Khemglad
N:Khemglad;Manatcha;;;
ORG:Han's Laser (Thailand)
TITLE:Engineer
TEL;TYPE=CELL:+66991363677
EMAIL:manatcha27196@gmail.com
URL:${cardUrl}
END:VCARD`;
 const blob=new Blob([vcard],{type:"text/vcard;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="Manatcha-Khemglad.vcf";
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function shareCard(){
 const shareData={
  title:"Manatcha Khemglad | Digital Card",
  text:"Manatcha Khemglad - Digital Business Card",
  url:cardUrl
 };
 if(navigator.share){
  try{await navigator.share(shareData)}catch(error){}
  return;
 }
 try{
  await navigator.clipboard.writeText(cardUrl);
  const span=document.querySelector("#shareButton span");
  const original=span.textContent;
  span.textContent="Link Copied!";
  setTimeout(()=>span.textContent=original,1800);
 }catch(error){
  prompt("Copy this URL:",cardUrl);
 }
}

generateQR();
</script>
