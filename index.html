<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07101d">
<title>Manatcha Khemglad | Digital Card</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:radial-gradient(circle at 20% 0,#263d73 0,transparent 36%),radial-gradient(circle at 100% 100%,#123e4d 0,transparent 38%),#060a12;display:flex;justify-content:center;padding:22px 14px}
.card{width:min(430px,100%);padding:24px 18px 22px;border:1px solid #ffffff1c;border-radius:30px;background:#ffffff0b;backdrop-filter:blur(18px);box-shadow:0 24px 70px #0009}
.photo{width:118px;height:118px;border-radius:50%;object-fit:cover;object-position:center top;display:block;margin:auto;border:3px solid #fff;box-shadow:0 0 35px #5c7cff77}
h1{text-align:center;margin:15px 0 3px;font-size:27px;letter-spacing:.2px}
.role{text-align:center;color:#b9c5dc;margin:0 0 20px;font-size:16px}
.badge{display:block;width:max-content;margin:0 auto 22px;padding:7px 12px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff12;color:#b9c7e6;font-size:12px}
.buttons{display:grid;gap:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 16px;border-radius:16px;color:#fff;text-decoration:none;font-size:16px;font-weight:700;background:#ffffff0c;border:1px solid #ffffff14}
.primary{background:linear-gradient(135deg,#6558ff,#009edb);border:0}
.btn:active{transform:scale(.98)}
.qr{margin:22px auto 8px;padding:13px;width:168px;background:#fff;border-radius:18px}
.qr img{width:142px;height:142px;display:block}
.small{text-align:center;color:#7f8ba4;font-size:12px;margin:9px 0 0}
footer{text-align:center;color:#69748c;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<main class="card">
<img class="photo" src="profile.jpg" alt="Manatcha Khemglad">
<h1>Manatcha Khemglad</h1>
<p class="role">Engineer at Han's Laser(Thailand)</p>
<span class="badge">⌚ NFC Digital Business Card</span>

<div class="buttons">
<a class="btn primary" href="tel:+66991363677">📞 Call me</a>
<a class="btn" href="https://line.me/ti/p/DYkaL3vXRd" target="_blank" rel="noopener">💬 LINE</a>
<a class="btn" href="mailto:manatcha27196@gmail.com">✉️ Email</a>
<button class="btn" onclick="saveContact()">👤 Save Contact</button>
<button class="btn" onclick="shareCard()">↗️ Share Card</button>
</div>

<div class="qr"><img id="qr" alt="QR Code"></div>
<p class="small">Scan QR for Open Digital Card</p>
<footer>Powered by GitHub Pages • NFC Ready</footer>
</main>

<script>
const cardUrl=window.location.href;
document.getElementById("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+encodeURIComponent(cardUrl);

function saveContact(){
const vcard=`BEGIN:VCARD
VERSION:3.0
FN:Manatcha Khemglad
TITLE:Engineer Han's Laser
TEL:0991363677
EMAIL:manatcha27196@gmail.com
URL:${cardUrl}
END:VCARD`;
const blob=new Blob([vcard],{type:"text/vcard"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");a.href=url;a.download="Manatcha-Khemglad.vcf";a.click();
URL.revokeObjectURL(url);
}
async function shareCard(){
if(navigator.share){await navigator.share({title:"Manatcha Khemglad | Digital Card",text:"Digital Business Card",url:cardUrl});}
else{await navigator.clipboard.writeText(cardUrl);alert("คัดลอกลิงก์แล้ว");}
}
</script>
</body>
</html>
