<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mnch Kh | Digital Card</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #111820;
    border: 1px solid #293542;
    border-radius: 28px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.avatar {
    width: 100px;
    height: 100px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(135deg,#00d4ff,#7657ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    border: 4px solid #1d2731;
}

h1 {
    margin: 18px 0 5px;
    font-size: 30px;
}

.role {
    color: #9ca9b5;
    margin-bottom: 20px;
}

.tag {
    display: inline-block;
    padding: 7px 13px;
    border-radius: 20px;
    background: #18232d;
    color: #55dfff;
    font-size: 12px;
    margin-bottom: 25px;
}

.buttons {
    display: grid;
    gap: 12px;
}

button {
    width: 100%;
    min-height: 50px;
    border: 1px solid #344352;
    border-radius: 14px;
    background: #18212a;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #22303c;
}

.primary {
    background: #176b8a;
    border-color: #2aaedb;
}

.footer {
    margin-top: 25px;
    color: #667582;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

    <div class="avatar">MK</div>

    <h1>Mnch Kh</h1>

    <div class="role">
        Engineering • Automation • Laser Technology
    </div>

    <div class="tag">
        NFC DIGITAL BUSINESS CARD
    </div>

    <div class="buttons">

        <button class="primary" onclick="saveContact()">
            💾 Save Contact
        </button>

        <button onclick="callMe()">
            📞 Contact
        </button>

        <button onclick="lineMe()">
            💬 LINE
        </button>

        <button onclick="emailMe()">
            ✉️ Email
        </button>

        <button onclick="shareCard()">
            🔗 Share Card
        </button>

    </div>

    <div class="footer">
        Tap NFC • Open Card • Save Contact
    </div>

</div>

<script>

function saveContact() {

    const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:Mnch Kh
TEL:+66XXXXXXXXX
EMAIL:your@email.com
ORG:Your Company
TITLE:Engineer
END:VCARD`;

    const blob = new Blob([vcard], {
        type: "text/vcard"
    });

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "Mnch-Kh.vcf";
    a.click();

    URL.revokeObjectURL(url);
}

function callMe() {
    window.location.href = "tel:+66XXXXXXXXX";
}

function lineMe() {
    window.location.href = "https://line.me/";
}

function emailMe() {
    window.location.href = "mailto:your@email.com";
}

async function shareCard() {

    if (navigator.share) {

        await navigator.share({
            title: "Mnch Kh",
            text: "My Digital Business Card",
            url: window.location.href
        });

    } else {

        alert("คัดลอก URL ของหน้านี้เพื่อแชร์ได้เลย");

    }
}

</script>

</body>
</html>
