<script>

/* =====================================================
   CURRENT PAGE URL
===================================================== */

const cardUrl =
    window.location.href;


/* =====================================================
   GENERATE QR CODE
===================================================== */

function generateQR(){

    const qrElement =
        document.getElementById("qr");

    const status =
        document.getElementById("qr-status");


    if(
        typeof qrcode === "undefined"
    ){

        status.textContent =
            "กำลังโหลด QR Code...";

        setTimeout(
            generateQR,
            300
        );

        return;

    }


    try{

        const qr =
            qrcode(
                0,
                "M"
            );


        qr.addData(
            cardUrl
        );


        qr.make();


        /*
         * สร้าง QR เป็น SVG
         */

        qrElement.innerHTML =
            qr.createSvgTag(
                5,
                0
            );


        const svg =
            qrElement.querySelector(
                "svg"
            );


        if(svg){

            svg.setAttribute(
                "width",
                "150"
            );

            svg.setAttribute(
                "height",
                "150"
            );

            svg.style.width =
                "150px";

            svg.style.height =
                "150px";

            svg.style.display =
                "block";

        }


        status.textContent =
            "QR Code Ready";

    }

    catch(error){

        console.error(error);

        status.textContent =
            "QR Code Error";

    }

}


/* =====================================================
   SAVE CONTACT
===================================================== */

function saveContact(){

    const vcard =

`BEGIN:VCARD
VERSION:3.0
FN:Manatcha Khemglad
N:Khemglad;Manatcha;;;
ORG:Han's Laser (Thailand)
TITLE:Engineer
TEL;TYPE=CELL:+66991363677
EMAIL:manatcha27196@gmail.com
URL:${cardUrl}
END:VCARD`;


    const blob =
        new Blob(
            [vcard],
            {
                type:
                    "text/vcard;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "Manatcha-Khemglad.vcf";


    document.body.appendChild(
        a
    );


    a.click();


    document.body.removeChild(
        a
    );


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


/* =====================================================
   SHARE CARD
===================================================== */

async function shareCard(){

    const shareData = {

        title:
            "Manatcha Khemglad | Digital Card",

        text:
            "Manatcha Khemglad - Digital Business Card",

        url:
            cardUrl

    };


    /*
     * Android / modern browser
     */

    if(
        navigator.share
    ){

        try{

            await navigator.share(
                shareData
            );

        }

        catch(error){

            /*
             * User cancelled sharing
             */

        }

        return;

    }


    /*
     * Clipboard fallback
     */

    try{

        await navigator.clipboard.writeText(
            cardUrl
        );


        alert(
            "คัดลอกลิงก์นามบัตรแล้ว"
        );

    }

    catch(error){

        prompt(
            "คัดลอกลิงก์นี้เพื่อแชร์:",
            cardUrl
        );

    }

}


/* =====================================================

generateQR();
